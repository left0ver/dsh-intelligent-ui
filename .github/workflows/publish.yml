name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure supported npm version
        run: npm install --global npm@11

      # Both steps below run `prepack`: typecheck, tests, and the build.
      # A manual run only checks what would be published.
      - name: Check the package
        if: github.event_name != 'push'
        run: npm pack --dry-run

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi

      - name: Publish
        if: github.event_name == 'push'
        run: npm publish
